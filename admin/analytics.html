<body>
<div class="admin">

<aside class="admin__side">

    <div><b>LUXORA</b><span>Admin</span></div></div>
  <nav class="admin__nav"><h6>Overview</h6><a href="../admin/dashboard.html" class="" data-ic="grid">Dashboard</a><a href="../admin/analytics.html" class="is-on" data-ic="chart">Analytics</a><h6>Catalogue</h6><a href="../admin/products.html" class="" data-ic="box">Products</a><a href="../admin/inventory.html" class="" data-ic="tag">Inventory</a><a href="../admin/reviews.html" class="" data-ic="star">Reviews</a><a href="../admin/coupons.html" class="" data-ic="tag">Coupons</a><h6>Commerce</h6><a href="../admin/orders.html" class="" data-ic="box">Orders</a><a href="../admin/customers.html" class="" data-ic="users">Customers</a><h6>Intelligence</h6><a href="../admin/ai.html" class="" data-ic="spark">AI Conversations<span class="tag">AI</span></a><a href="../admin/settings.html" class="" data-ic="gear">Settings</a></nav>

    <div><b>Admin</b><span>Owner</span></div></div>

<div class="admin__main">
  <header class="admin__top">

    <h1>Analytics</h1>

    <div class="panel"><div class="panel__head"><div><h3 class="panel__title">Order volume</h3></div></div><div id="chart-orders"></div></div>
    <div class="panel"><div class="panel__head"><div><h3 class="panel__title">Channels</h3></div></div>
      <div style="display:grid;place-items:center" id="chart-channels"></div><div class="legend" id="legend-channels"></div></div>
  </div>
  <div class="panel"><div class="panel__head"><div><h3 class="panel__title">Revenue by region</h3></div></div><div id="chart-regions" style="margin-top:1rem"></div></div>

  </div>

<script>
document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll(".admin__nav a[data-ic]").forEach(function(a){
    if(!a.querySelector("svg")) a.insertAdjacentHTML("afterbegin", window.LX.icon(a.getAttribute("data-ic"),16));
  });
});
</script>
