<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Luxora Admin</title><meta name="description" content="Luxora admin">
<link rel="icon" href="../assets/images/logos/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/pages.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin">

<aside class="admin__side">
  <div class="admin__brand"><img src="../assets/images/logos/luxora-mark.png" alt="">
    <div><b>LUXORA</b><span>Admin</span></div></div>
  <nav class="admin__nav"><h6>Overview</h6><a href="../admin/dashboard.html" class="" data-ic="grid">Dashboard</a><a href="../admin/analytics.html" class="" data-ic="chart">Analytics</a><h6>Catalogue</h6><a href="../admin/products.html" class="" data-ic="box">Products</a><a href="../admin/inventory.html" class="" data-ic="tag">Inventory</a><a href="../admin/reviews.html" class="" data-ic="star">Reviews</a><a href="../admin/coupons.html" class="" data-ic="tag">Coupons</a><h6>Commerce</h6><a href="../admin/orders.html" class="" data-ic="box">Orders</a><a href="../admin/customers.html" class="" data-ic="users">Customers</a><h6>Intelligence</h6><a href="../admin/ai.html" class="" data-ic="spark">AI Conversations<span class="tag">AI</span></a><a href="../admin/settings.html" class="is-on" data-ic="gear">Settings</a></nav>
  <div class="admin__user"><div class="avatar" style="width:36px;height:36px">AR</div>
    <div><b>Admin</b><span>Owner</span></div></div>
</aside>

<div class="admin__main">
  <header class="admin__top">
    <button class="icon-btn admin__burger" id="admin-burger" aria-label="Menu">&#9776;</button>
    <h1>Settings</h1>
    <div class="admin__search"><input class="input" placeholder="Search…" aria-label="Search"></div>
    <a class="btn btn--ghost btn--sm" href="../index.html">View store &rarr;</a>
  </header>
  <div class="admin__body">

<div class="panel" style="max-width:640px">
  <div class="panel__head"><div><h3 class="panel__title">Store settings</h3></div></div>
  <label class="field"><span class="field__label">Store name</span><input class="input" value="Luxora Commerce"></label>
  <label class="field"><span class="field__label">Support email</span><input class="input" value="care@luxora.example"></label>
  <div class="grid-2">
    <label class="field"><span class="field__label">Currency</span><select class="select"><option>USD</option><option>EUR</option><option>GBP</option><option>CHF</option></select></label>
    <label class="field"><span class="field__label">Free shipping over</span><input class="input mono" value="$500"></label>
  </div>
  <label class="field"><span class="field__label">Tax rate</span><input class="input mono" value="8%"></label>
  <button class="btn btn--primary" onclick="window.LX.toast('Settings saved','Your store settings have been updated.')">Save settings</button>
</div>

  </div>
</div>
</div>
<script src="../assets/js/data/luxora-data.js"></script>
<script src="../assets/js/core/utils.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/features/ai.js"></script>
<script src="../assets/js/features/admin.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll(".admin__nav a[data-ic]").forEach(function(a){
    if(!a.querySelector("svg")) a.insertAdjacentHTML("afterbegin", window.LX.icon(a.getAttribute("data-ic"),16));
  });
});
</script>

</body></html>
