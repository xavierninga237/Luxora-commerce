<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Luxora Commerce</title>
<meta name="description" content="Browse the full Luxora collection of luxury watches and fine jewelry.">
<meta property="og:title" content="Shop — Luxora Commerce">
<meta property="og:description" content="Browse the full Luxora collection of luxury watches and fine jewelry.">
<meta property="og:type" content="website">
<meta property="og:image" content="../assets/images/logos/og-image.jpg">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="../assets/images/logos/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/images/logos/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-chrome="header"></div>
<main id="main">

<section class="page-head"><div class="shell">
  <div class="breadcrumb"><a href="../index.html">Home</a><span>/</span>Shop</div>
  <h1>The collection</h1>
  <p class="lead">Sixty-four pieces across watches, jewelry and accessories. Filter by category, brand, material or price — every filter is shareable in the URL.</p>
</div></section>
<section class="section section--tight"><div class="shell">
  <div class="shop">
    <aside class="shop__filters" id="shop-filters" aria-label="Filters"></aside>
    <div>
      <div class="shop__bar">
        <span class="shop__count" id="shop-count"></span>
        <label class="cluster" style="gap:.5rem">
          <span class="muted" style="font-size:var(--step--2);letter-spacing:.08em;text-transform:uppercase">Sort</span>
          <select class="select" id="shop-sort" style="width:auto">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="rating">Top rated</option>
            <option value="newest">Newest</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
      <div class="shop__active" id="shop-active"></div>
      <div class="grid grid--3" id="shop-grid"></div>
      <div class="pagination" id="shop-pager"></div>
    </div>
  </div>
</div></section>

</main>
<div data-chrome="footer"></div>
<div data-chrome="drawers"></div>
<script src="../assets/js/data/luxora-data.js"></script>
<script src="../assets/js/core/utils.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/chrome.js"></script>
<script src="../assets/js/features/ai.js"></script>
<script src="../assets/js/features/catalog.js"></script>
</body>
</html>
