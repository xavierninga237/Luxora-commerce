<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Luxora Commerce</title>
<meta name="description" content="Sign in to your account.">
<meta property="og:title" content="Sign in — Luxora Commerce">
<meta property="og:description" content="Sign in to your account.">
<meta property="og:type" content="website">
<meta property="og:image" content="../assets/images/logos/og-image.jpg">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="../assets/images/logos/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/images/logos/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main">
<div class="auth">
  <div class="auth__aside">
    <img class="bgart" src="../assets/images/collections/diamond.svg" alt="">
    <div class="auth__aside-inner">
      <img src="../assets/images/logos/luxora-mark.png" alt="Luxora">
      <h2 class="display" style="font-size:2.2rem">Timeless Luxury.<br>Delivered Worldwide.</h2>
      <p class="muted">Members of the Luxora Circle receive early access to limited editions and private previews.</p>
    </div>
  </div>
  <div class="auth__form"><div class="auth__form-inner">
<a class="link-line" href="../index.html" style="margin-bottom:2rem">&larr; <span>Back to store</span></a>
<h1 style="font-size:2.2rem">Welcome back</h1>
<p class="muted" style="margin-bottom:2rem">Sign in to your Luxora account.</p>
<form id="auth-form">
  <label class="field"><span class="field__label">Email</span><input class="input" id="auth-email" type="email" placeholder="you@example.com" required></label>
  <label class="field"><span class="field__label">Password</span><input class="input" type="password" placeholder="••••••••" required></label>
  <div class="spread" style="margin-bottom:1.5rem">
    <label class="check"><input type="checkbox"><span>Remember me</span></label>
    <a class="link-line" href="../auth/forgot-password.html" style="font-size:var(--step--2)">Forgot password?</a>
  </div>
  <button class="btn btn--primary btn--lg btn--block" type="submit">Sign in</button>
</form>
<div class="auth__divider">or</div>
<button class="btn btn--secondary btn--block" onclick="window.LX.Session.signIn('guest@luxora.com','Guest');window.location.href='../account/dashboard.html'">Continue as guest</button>
<p class="center muted" style="margin-top:2rem;font-size:var(--step--1)">New here? <a class="link-line" href="../auth/register.html" style="display:inline-flex">Create an account</a></p>
</div></div>
</div>
</main>
<script src="../assets/js/data/luxora-data.js"></script>
<script src="../assets/js/core/utils.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/chrome.js"></script>
<script src="../assets/js/features/ai.js"></script>
<script src="../assets/js/features/pages.js"></script>
</body></html>
